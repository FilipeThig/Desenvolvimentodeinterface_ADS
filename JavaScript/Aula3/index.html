<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1 id="titulo">Calculadora</h1>

    <input id="nome" type="text" placeholder="Nome do estudante">

    <input id="nota1" type="number" min="0" max="10" step="0.1" placeholder="Nota 1">
    <input id="nota2" type="number" min="0" max="10" step="0.1" placeholder="Nota 2">
    <input id="nota3" type="number" min="0" max="10" step="0.1" placeholder="Nota 3">

    <button id="calcular" type="button">Calcular</button>

    <p id="resultado" aria-live="polite">Aguardando...</p>

</body>
</html>
